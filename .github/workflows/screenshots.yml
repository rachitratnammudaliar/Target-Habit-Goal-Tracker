name: Screenshots

# Boots an Android emulator, runs the app with sample data and commits fresh screenshots.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/src/main/**", "app/src/androidTest/**", "scripts/screenshots.sh", ".github/workflows/screenshots.yml"]

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            ./scripts/screenshots.sh

      - name: Commit screenshots
        run: |
          git config user.name "Rachit Ratnam Mudaliar"
          git config user.email "rachitratnam@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update screenshots [skip ci]"
            # main may have moved while the emulator ran; replay on top and retry.
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              sleep 5
            done
          fi
