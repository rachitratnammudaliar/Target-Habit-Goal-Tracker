name: Build

# Builds and tests every version of Target. When version.txt has a version that hasn't been
# released yet, publishes one release with the Android and iOS files.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] \
             && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION will be published."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TARGET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/target.jks"
            echo "TARGET_KEYSTORE_PATH=$RUNNER_TEMP/target.jks" >> "$GITHUB_ENV"
            echo "Release key found."
          else
            echo "No private key secret set. Using the committed public build key."
          fi

      - name: Test and build
        env:
          TARGET_VERSION_CODE: ${{ github.run_number }}
          TARGET_VERSION_NAME: ${{ needs.version.outputs.name }}
          TARGET_KEYSTORE_PASSWORD: ${{ secrets.TARGET_KEYSTORE_PASSWORD }}
          TARGET_KEY_ALIAS: ${{ secrets.TARGET_KEY_ALIAS }}
          TARGET_KEY_PASSWORD: ${{ secrets.TARGET_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Target-${{ needs.version.outputs.name }}-Android.apk"

      - name: Check there is no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions dist/*.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK asks for internet access, but Target must stay offline."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    needs: version
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: ios/test.sh
      - name: Build unsigned IPA
        run: ios/build-ipa.sh "${{ needs.version.outputs.name }}" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  publish:
    needs: [version, android, ios]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          VERSION=${{ needs.version.outputs.name }}
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat .github/release-install.md >> notes.md
          ls -la dist
          cat notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: Target ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*
          make_latest: true
